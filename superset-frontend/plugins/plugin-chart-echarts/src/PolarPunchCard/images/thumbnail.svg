<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="120" height="120" fill="#FFFFFF"/>

  <!-- Polar grid lines (subtle) -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#E8E8E8" stroke-width="0.5"/>
  <circle cx="60" cy="60" r="30" fill="none" stroke="#E8E8E8" stroke-width="0.5"/>
  <circle cx="60" cy="60" r="15" fill="none" stroke="#E8E8E8" stroke-width="0.5"/>

  <!-- Radial lines -->
  <line x1="60" y1="60" x2="60" y2="15" stroke="#E8E8E8" stroke-width="0.5"/>
  <line x1="60" y1="60" x2="105" y2="60" stroke="#E8E8E8" stroke-width="0.5"/>
  <line x1="60" y1="60" x2="60" y2="105" stroke="#E8E8E8" stroke-width="0.5"/>
  <line x1="60" y1="60" x2="15" y2="60" stroke="#E8E8E8" stroke-width="0.5"/>

  <!-- Data bubbles - different sizes representing intensity -->
  <!-- Ring 1 (outer) -->
  <circle cx="60" cy="20" r="8" fill="#1FA8C9" opacity="0.7"/>
  <circle cx="95" cy="35" r="4" fill="#1FA8C9" opacity="0.7"/>
  <circle cx="100" cy="60" r="10" fill="#1FA8C9" opacity="0.7"/>
  <circle cx="90" cy="85" r="3" fill="#1FA8C9" opacity="0.7"/>

  <!-- Ring 2 (middle) -->
  <circle cx="60" cy="35" r="6" fill="#454E7C" opacity="0.7"/>
  <circle cx="80" cy="50" r="9" fill="#454E7C" opacity="0.7"/>
  <circle cx="70" cy="80" r="5" fill="#454E7C" opacity="0.7"/>
  <circle cx="35" cy="70" r="7" fill="#454E7C" opacity="0.7"/>

  <!-- Ring 3 (inner) -->
  <circle cx="60" cy="50" r="4" fill="#5AC189" opacity="0.7"/>
  <circle cx="70" cy="60" r="6" fill="#5AC189" opacity="0.7"/>
  <circle cx="55" cy="65" r="8" fill="#5AC189" opacity="0.7"/>
  <circle cx="50" cy="55" r="3" fill="#5AC189" opacity="0.7"/>
</svg>
