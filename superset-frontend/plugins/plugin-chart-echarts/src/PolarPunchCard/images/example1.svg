<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle">24-Hour Activity Pattern by Day of Week</text>

  <!-- Polar grid -->
  <g transform="translate(300, 220)">
    <!-- Concentric circles for days -->
    <circle r="140" fill="none" stroke="#E0E0E0" stroke-width="1"/>
    <circle r="105" fill="none" stroke="#E0E0E0" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#E0E0E0" stroke-width="1"/>
    <circle r="35" fill="none" stroke="#E0E0E0" stroke-width="1"/>

    <!-- Hour markers (24 lines) -->
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="39" y2="-144" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="75" y2="-130" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="106" y2="-106" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="130" y2="-75" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="144" y2="-39" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="150" y2="0" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="144" y2="39" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="130" y2="75" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="106" y2="106" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="75" y2="130" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="39" y2="144" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-39" y2="144" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-75" y2="130" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-106" y2="106" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-130" y2="75" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-144" y2="39" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-150" y2="0" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-144" y2="-39" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-130" y2="-75" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-106" y2="-106" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-75" y2="-130" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-39" y2="-144" stroke="#E0E0E0" stroke-width="0.5"/>

    <!-- Sample data points showing activity pattern -->
    <!-- Small circles = low activity, large = high activity -->
    <circle cx="0" cy="-40" r="3" fill="#1FA8C9" opacity="0.6"/>
    <circle cx="30" cy="-115" r="8" fill="#1FA8C9" opacity="0.6"/>
    <circle cx="99" cy="-100" r="12" fill="#FF7F44" opacity="0.6"/>
    <circle cx="135" cy="-35" r="5" fill="#1FA8C9" opacity="0.6"/>
    <circle cx="100" cy="100" r="15" fill="#FF7F44" opacity="0.6"/>
    <circle cx="-60" cy="120" r="10" fill="#1FA8C9" opacity="0.6"/>
    <circle cx="-130" cy="50" r="4" fill="#5AC189" opacity="0.6"/>
    <circle cx="-100" cy="-80" r="6" fill="#5AC189" opacity="0.6"/>

    <!-- More data points for realistic pattern -->
    <circle cx="20" cy="-70" r="5" fill="#454E7C" opacity="0.6"/>
    <circle cx="65" cy="-60" r="9" fill="#454E7C" opacity="0.6"/>
    <circle cx="120" cy="-20" r="7" fill="#5AC189" opacity="0.6"/>
    <circle cx="110" cy="40" r="11" fill="#FF7F44" opacity="0.6"/>
    <circle cx="70" cy="100" r="13" fill="#FF7F44" opacity="0.6"/>
    <circle cx="0" cy="130" r="6" fill="#1FA8C9" opacity="0.6"/>
    <circle cx="-80" cy="95" r="8" fill="#1FA8C9" opacity="0.6"/>
    <circle cx="-125" cy="10" r="4" fill="#5AC189" opacity="0.6"/>

    <!-- Hour labels -->
    <text x="0" y="-165" font-size="11" fill="#666" text-anchor="middle">0h</text>
    <text x="150" y="5" font-size="11" fill="#666" text-anchor="start">6h</text>
    <text x="0" y="170" font-size="11" fill="#666" text-anchor="middle">12h</text>
    <text x="-150" y="5" font-size="11" fill="#666" text-anchor="end">18h</text>
  </g>

  <!-- Legend -->
  <g transform="translate(450, 50)">
    <text x="0" y="0" font-size="12" fill="#666" font-weight="bold">Activity Level</text>
    <circle cx="0" cy="20" r="4" fill="#5AC189" opacity="0.6"/>
    <text x="10" y="24" font-size="10" fill="#666">Low</text>
    <circle cx="0" cy="40" r="8" fill="#1FA8C9" opacity="0.6"/>
    <text x="15" y="44" font-size="10" fill="#666">Medium</text>
    <circle cx="0" cy="65" r="12" fill="#FF7F44" opacity="0.6"/>
    <text x="20" y="69" font-size="10" fill="#666">High</text>
  </g>
</svg>
