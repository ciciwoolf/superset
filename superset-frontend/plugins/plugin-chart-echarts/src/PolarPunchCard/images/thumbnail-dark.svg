<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="120" height="120" fill="#1C1E24"/>

  <!-- Polar grid lines (subtle) -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#3D3D3D" stroke-width="0.5"/>
  <circle cx="60" cy="60" r="30" fill="none" stroke="#3D3D3D" stroke-width="0.5"/>
  <circle cx="60" cy="60" r="15" fill="none" stroke="#3D3D3D" stroke-width="0.5"/>

  <!-- Radial lines -->
  <line x1="60" y1="60" x2="60" y2="15" stroke="#3D3D3D" stroke-width="0.5"/>
  <line x1="60" y1="60" x2="105" y2="60" stroke="#3D3D3D" stroke-width="0.5"/>
  <line x1="60" y1="60" x2="60" y2="105" stroke="#3D3D3D" stroke-width="0.5"/>
  <line x1="60" y1="60" x2="15" y2="60" stroke="#3D3D3D" stroke-width="0.5"/>

  <!-- Data bubbles - different sizes representing intensity -->
  <!-- Ring 1 (outer) -->
  <circle cx="60" cy="20" r="8" fill="#37D5F2" opacity="0.8"/>
  <circle cx="95" cy="35" r="4" fill="#37D5F2" opacity="0.8"/>
  <circle cx="100" cy="60" r="10" fill="#37D5F2" opacity="0.8"/>
  <circle cx="90" cy="85" r="3" fill="#37D5F2" opacity="0.8"/>

  <!-- Ring 2 (middle) -->
  <circle cx="60" cy="35" r="6" fill="#8B7FD4" opacity="0.8"/>
  <circle cx="80" cy="50" r="9" fill="#8B7FD4" opacity="0.8"/>
  <circle cx="70" cy="80" r="5" fill="#8B7FD4" opacity="0.8"/>
  <circle cx="35" cy="70" r="7" fill="#8B7FD4" opacity="0.8"/>

  <!-- Ring 3 (inner) -->
  <circle cx="60" cy="50" r="4" fill="#6DD3A7" opacity="0.8"/>
  <circle cx="70" cy="60" r="6" fill="#6DD3A7" opacity="0.8"/>
  <circle cx="55" cy="65" r="8" fill="#6DD3A7" opacity="0.8"/>
  <circle cx="50" cy="55" r="3" fill="#6DD3A7" opacity="0.8"/>
</svg>
